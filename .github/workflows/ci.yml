name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify supported Next.js version
        run: |
          NEXT_MAJOR=$(node -p "require('./node_modules/next/package.json').version.split('.')[0]")
          if [ "$NEXT_MAJOR" -lt 16 ]; then
            echo "::error::Next.js major version ($NEXT_MAJOR) is below the supported floor (16)."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Docker build
        run: docker build --tag fifth-felony:${{ github.sha }} .
